<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent OS Graph Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/force-graph"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #f8fafc; color: #334155; font-family: 'Inter', sans-serif; }
        #graph-wrapper { width: 100%; flex: 1; position: relative; overflow: hidden; }
        #graph-container { position: absolute; inset: 0; width: 100%; height: 100%; }
        
        /* Custom Scrollbar for Popovers */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
        
        .node-label { font-family: 'Inter', sans-serif; pointer-events: none; }
        
        /* Dropdown Popover Animations */
        .popover-enter { animation: popoverIn 0.15s ease-out forwards; }
        @keyframes popoverIn {
            from { opacity: 0; transform: translateY(-4px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden text-slate-600 text-sm">

    <!-- TOP HEADER LAYOUT -->
    <div class="w-full bg-white border-b border-slate-200 flex flex-col z-30 shadow-sm flex-shrink-0">
        <!-- Row 1: Branding, Global Search, and Actions -->
        <div class="flex items-center justify-between px-6 py-3 gap-6">
            <!-- Branding -->
            <div class="flex items-center gap-3 flex-shrink-0">
                <div class="w-8 h-8 rounded bg-blue-50 text-blue-600 flex items-center justify-center font-bold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight text-slate-800">Agent OS Graph</h1>
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Knowledge Base Explorer</p>
                </div>
            </div>

            <!-- Global Search & Toggle -->
            <div class="flex items-center gap-6 flex-1 max-w-3xl">
                <div class="relative flex-1">
                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="search-input" placeholder="Search files, tags, or projects..." class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-800 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 transition-all">
                </div>
                <label class="flex items-center gap-2 text-sm cursor-pointer hover:text-blue-600 transition-colors whitespace-nowrap font-medium text-slate-600">
                    <input type="checkbox" id="toggle-labels" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-4 h-4">
                    Show all labels
                </label>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-3 flex-shrink-0">
                <input type="file" id="file-upload" accept=".json" class="hidden">
                <button onclick="document.getElementById('file-upload').click()" class="px-4 py-2 bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg text-sm font-medium transition-all flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Upload JSON
                </button>
                <button id="btn-reset" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors hidden shadow-sm">
                    Reset
                </button>
                <button id="btn-generate" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-sm font-medium transition-all shadow-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <span id="btn-generate-text">Test Scale (30k)</span>
                </button>
            </div>
        </div>

        <!-- Row 2: Advanced Filters & Stats -->
        <div class="flex items-center justify-between px-6 py-2 bg-slate-50/80 border-t border-slate-200 overflow-visible">
            <div class="flex items-center gap-3 text-sm flex-shrink-0 relative">
                <span class="font-bold text-slate-400 uppercase tracking-wider text-xs mr-1">Filters:</span>
                
                <!-- Custom Multi-Select Dropdowns -->
                <div class="relative" id="dropdown-type">
                    <button class="dropdown-trigger bg-white border border-slate-200 hover:border-slate-300 text-slate-700 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-100 flex items-center justify-between min-w-[140px] shadow-sm transition-colors text-xs font-medium">
                        <span class="truncate pr-2">All Types</span>
                        <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <!-- Popover injected by JS -->
                </div>

                <div class="relative" id="dropdown-repo">
                    <button class="dropdown-trigger bg-white border border-slate-200 hover:border-slate-300 text-slate-700 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-100 flex items-center justify-between min-w-[140px] shadow-sm transition-colors text-xs font-medium">
                        <span class="truncate pr-2">All Repos</span>
                        <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </div>

                <div class="relative" id="dropdown-project">
                    <button class="dropdown-trigger bg-white border border-slate-200 hover:border-slate-300 text-slate-700 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-100 flex items-center justify-between min-w-[140px] shadow-sm transition-colors text-xs font-medium">
                        <span class="truncate pr-2">All Projects</span>
                        <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </div>

                <div class="relative" id="dropdown-tag">
                    <button class="dropdown-trigger bg-white border border-slate-200 hover:border-slate-300 text-slate-700 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-100 flex items-center justify-between min-w-[140px] shadow-sm transition-colors text-xs font-medium">
                        <span class="truncate pr-2">All Tags</span>
                        <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </div>

                <input type="text" id="filter-name" placeholder="Name contains..." class="bg-white border border-slate-200 hover:border-slate-300 text-slate-700 rounded-md px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-100 w-36 shadow-sm transition-colors">
                <input type="text" id="filter-title" placeholder="Title contains..." class="bg-white border border-slate-200 hover:border-slate-300 text-slate-700 rounded-md px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-100 w-36 shadow-sm transition-colors">
            </div>

            <!-- Stats -->
            <div class="flex items-center gap-5 text-xs flex-shrink-0 ml-4">
                <div class="flex items-center gap-1.5"><span class="text-slate-500">Nodes:</span><span class="font-bold text-blue-600 text-sm" id="stat-nodes">0</span></div>
                <div class="flex items-center gap-1.5"><span class="text-slate-500">Connections:</span><span class="font-bold text-emerald-600 text-sm" id="stat-edges">0</span></div>
                <div class="flex items-center gap-1.5"><span class="text-slate-500">Projects:</span><span class="font-bold text-orange-500 text-sm" id="stat-projects">0</span></div>
                <div class="flex items-center gap-1.5"><span class="text-slate-500">Tags:</span><span class="font-bold text-purple-500 text-sm" id="stat-tags">0</span></div>
            </div>
        </div>
    </div>

    <!-- MAIN GRAPH AREA -->
    <div id="graph-wrapper" class="bg-white">
        <div id="graph-container"></div>

        <!-- Physics Controls Overlay -->
        <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10 bg-white/90 backdrop-blur border border-slate-200 rounded-full shadow-lg px-4 py-2 flex items-center gap-4">
            <button id="btn-zoom-in" class="text-slate-500 hover:text-slate-800 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg></button>
            <button id="btn-zoom-out" class="text-slate-500 hover:text-slate-800 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg></button>
            <button id="btn-fit" class="text-slate-500 hover:text-slate-800 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg></button>
            <div class="w-px h-5 bg-slate-300"></div>
            <button id="btn-physics" class="flex items-center gap-2 text-emerald-600 font-semibold hover:text-emerald-700 w-28 justify-center transition-colors text-sm">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                Physics On
            </button>
        </div>

        <!-- Node Inspector Overlay -->
        <div id="inspector-panel" class="absolute top-6 right-6 w-80 bg-white/95 backdrop-blur border border-slate-200 rounded-xl shadow-xl flex flex-col hidden z-20 max-h-[80vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-start bg-slate-50/50 rounded-t-xl">
                <div>
                    <div id="inspector-type" class="text-[10px] font-bold uppercase tracking-wider text-blue-500 mb-1">Type</div>
                    <h3 id="inspector-title" class="font-bold text-slate-800 text-lg leading-tight truncate w-60">Node Name</h3>
                </div>
                <button id="btn-close-inspector" class="text-slate-400 hover:text-slate-700 bg-white rounded-full p-1 border border-transparent hover:border-slate-200 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 text-sm custom-scroll">
                <div class="mb-4">
                    <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Properties</h4>
                    <div id="inspector-props" class="bg-white rounded-lg border border-slate-100 p-3 space-y-2 shadow-sm">
                    </div>
                </div>
                <div>
                    <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Connections (<span id="inspector-conn-count">0</span>)</h4>
                    <div id="inspector-conns" class="space-y-1">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let graph;
        let originalData = { nodes: [], links: [] };
        let activeData = { nodes: [], links: [] };
        
        // High-Performance O(1) Lookups
        let neighborNodesMap = new Map();
        let nodeLinksMap = new Map();
        let nodeByIdMap = new Map();
        
        let hoverNode = null;
        let selectedNode = null;
        let highlightNodes = new Set();
        let highlightLinks = new Set();
        
        let isPhysicsRunning = true;
        let showLabelsGlobally = false;
        
        // Multi-Select State
        const multiSelectState = {
            type: new Set(),
            repo: new Set(),
            project: new Set(),
            tag: new Set()
        };

        const colors = {
            file: '#64748b',    // slate-500 (Refined gray for files)
            project: '#f97316', // orange-500 (Standout warm color)
            tag: '#8b5cf6',     // violet-500 (Distinct accent)
            repo: '#0ea5e9'     // sky-500 (Soft tech blue)
        };
        
        // --- PERFORMANCE HELPERS ---
        
        // Debounce function to prevent UI freezes when typing to filter 30k nodes
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => { clearTimeout(timeout); func(...args); };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // --- DATA LOGIC ---

        function synthesizeGraphData(rawData) {
            const nodes = [];
            const links = [];
            const projects = new Map();
            const tags = new Map();
            const repos = new Map();

            rawData.forEach((item, index) => {
                const nodeId = item.id || `file_${index}`;
                
                nodes.push({
                    id: nodeId,
                    name: item.name || 'Unknown Node',
                    title: item.title,
                    type: item.type || 'file',
                    repo: item.repo,
                    project: item.project,
                    val: item.val || 4,
                    raw: item,
                    // Pre-calculate render color to save CPU in render loop
                    renderColor: colors[item.type || 'file'] || colors.file
                });

                if (item.repo) {
                    if (!repos.has(item.repo)) repos.set(item.repo, { id: `repo_${item.repo}`, name: item.repo, type: 'repo', val: 12, renderColor: colors.repo });
                    links.push({ source: nodeId, target: `repo_${item.repo}` });
                }

                if (item.project) {
                    if (!projects.has(item.project)) projects.set(item.project, { id: `proj_${item.project}`, name: item.project, type: 'project', val: 8, renderColor: colors.project });
                    links.push({ source: nodeId, target: `proj_${item.project}` });
                }

                if (item.tags) {
                    let cleanTags = [];
                    if (typeof item.tags === 'string') cleanTags = item.tags.replace(/\[|\]/g, '').split(',').map(t => t.trim()).filter(t => t.length > 0);
                    else if (Array.isArray(item.tags)) cleanTags = item.tags;
                    
                    cleanTags.forEach(tag => {
                        if (!tags.has(tag)) tags.set(tag, { id: `tag_${tag}`, name: `#${tag}`, type: 'tag', val: 6, renderColor: colors.tag });
                        links.push({ source: nodeId, target: `tag_${tag}` });
                    });
                }
            });

            return {
                nodes: [...nodes, ...repos.values(), ...projects.values(), ...tags.values()],
                links: links
            };
        }

        // Pre-compute relationships for O(1) hover execution
        function buildPerformanceMaps(data) {
            neighborNodesMap.clear();
            nodeLinksMap.clear();
            nodeByIdMap.clear();
            
            data.nodes.forEach(n => {
                nodeByIdMap.set(n.id, n);
                neighborNodesMap.set(n.id, new Set());
                nodeLinksMap.set(n.id, []);
            });
            
            data.links.forEach(l => {
                const s = typeof l.source === 'object' ? l.source.id : l.source;
                const t = typeof l.target === 'object' ? l.target.id : l.target;
                
                if (neighborNodesMap.has(s)) neighborNodesMap.get(s).add(t);
                if (neighborNodesMap.has(t)) neighborNodesMap.get(t).add(s);
                
                if (nodeLinksMap.has(s)) nodeLinksMap.get(s).push(l);
                if (nodeLinksMap.has(t)) nodeLinksMap.get(t).push(l);
            });
        }

        function loadData(graphData, isNewUpload = true) {
            if (isNewUpload) {
                originalData = JSON.parse(JSON.stringify(graphData)); 
                activeData = graphData;
                buildPerformanceMaps(activeData);
                initDropdowns(); // Rebuild custom dropdown options
            } else {
                buildPerformanceMaps(graphData);
            }
            
            selectedNode = null;
            hoverNode = null;
            highlightNodes.clear();
            highlightLinks.clear();
            document.getElementById('inspector-panel').classList.add('hidden');

            graph.graphData(activeData);
            updateStats();
        }

        // --- CUSTOM MULTI-SELECT DROPDOWNS ---
        
        let activeDropdown = null;

        function createDropdownUI(id, label, options, typeKey) {
            const container = document.getElementById(id);
            const btn = container.querySelector('.dropdown-trigger');
            
            const existingPopover = container.querySelector('.popover');
            if (existingPopover) existingPopover.remove();

            const popover = document.createElement('div');
            popover.className = `popover absolute top-full left-0 mt-2 w-56 bg-white rounded-lg shadow-xl border border-slate-200 z-50 hidden popover-enter`;
            
            // Search Input
            const searchHtml = `
                <div class="p-2 border-b border-slate-100">
                    <input type="text" placeholder="Search ${label}..." class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded px-2 py-1.5 text-xs focus:outline-none focus:border-blue-500 focus:bg-white transition-colors" oninput="filterDropdownOptions(this, '${id}')">
                </div>
            `;
            
            // Options List
            const optionsHtml = options.map(opt => `
                <label class="flex items-center gap-2 px-3 py-2 hover:bg-slate-50 cursor-pointer text-sm text-slate-700 transition-colors dropdown-option">
                    <input type="checkbox" value="${opt}" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-3.5 h-3.5" onchange="handleDropdownChange('${typeKey}', '${opt}', this.checked); applyFiltersDebounced();">
                    <span class="truncate">${opt}</span>
                </label>
            `).join('');

            popover.innerHTML = searchHtml + `<div class="max-h-60 overflow-y-auto custom-scroll py-1" id="${id}-list">${optionsHtml}</div>`;
            container.appendChild(popover);

            btn.onclick = (e) => {
                e.stopPropagation();
                if (activeDropdown && activeDropdown !== popover) activeDropdown.classList.add('hidden');
                popover.classList.toggle('hidden');
                activeDropdown = popover.classList.contains('hidden') ? null : popover;
            };
        }

        window.filterDropdownOptions = function(inputEl, containerId) {
            const term = inputEl.value.toLowerCase();
            const labels = document.querySelectorAll(`#${containerId}-list .dropdown-option`);
            labels.forEach(label => {
                const text = label.textContent.toLowerCase();
                label.style.display = text.includes(term) ? 'flex' : 'none';
            });
        };

        window.handleDropdownChange = function(typeKey, value, isChecked) {
            if (isChecked) multiSelectState[typeKey].add(value);
            else multiSelectState[typeKey].delete(value);
            
            const btn = document.querySelector(`#dropdown-${typeKey} .dropdown-trigger span`);
            const count = multiSelectState[typeKey].size;
            btn.textContent = count === 0 ? `All ${typeKey.charAt(0).toUpperCase() + typeKey.slice(1)}s` : `${count} Selected`;
            if(count > 0) btn.parentElement.classList.add('border-blue-300', 'bg-blue-50/50');
            else btn.parentElement.classList.remove('border-blue-300', 'bg-blue-50/50');
        };

        function initDropdowns() {
            const repos = new Set(), projects = new Set(), tags = new Set(), types = new Set();
            
            originalData.nodes.forEach(n => {
                if (n.repo) repos.add(n.repo);
                if (n.project) projects.add(n.project);
                if (n.type === 'tag' && n.name) tags.add(n.name.replace('#', ''));
                if (n.type) types.add(n.type);
            });

            createDropdownUI('dropdown-type', 'Types', Array.from(types).sort(), 'type');
            createDropdownUI('dropdown-repo', 'Repos', Array.from(repos).sort(), 'repo');
            createDropdownUI('dropdown-project', 'Projects', Array.from(projects).sort(), 'project');
            createDropdownUI('dropdown-tag', 'Tags', Array.from(tags).sort(), 'tag');
            
            Object.keys(multiSelectState).forEach(k => multiSelectState[k].clear());
        }

        document.addEventListener('click', (e) => {
            if (activeDropdown && !activeDropdown.contains(e.target)) {
                activeDropdown.classList.add('hidden');
                activeDropdown = null;
            }
        });

        // --- RENDERING & PHYSICS ---

        function initGraph() {
            const elem = document.getElementById('graph-container');
            
            graph = ForceGraph()(elem)
                .backgroundColor('#ffffff')
                .nodeRelSize(4)
                .nodeVal(node => node.val || 4)
                .nodeColor(node => node.renderColor)
                .linkColor(link => highlightLinks.has(link) ? '#3b82f6' : 'rgba(226, 232, 240, 0.7)')
                .linkWidth(link => highlightLinks.has(link) ? 2.5 : 1)
                .linkDirectionalParticles(link => highlightLinks.has(link) ? 3 : 0)
                .linkDirectionalParticleWidth(3)
                .nodeCanvasObject((node, ctx, globalScale) => {
                    if (node.x === undefined || node.y === undefined) return;

                    const r = Math.sqrt(Math.max(0, node.val || 4)) * graph.nodeRelSize();
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, r, 0, 2 * Math.PI, false);
                    
                    const isHighlight = highlightNodes.has(node) || node === selectedNode || node === hoverNode;
                    const isMuted = (selectedNode || hoverNode) && !isHighlight;
                    
                    ctx.fillStyle = node.renderColor;
                    ctx.globalAlpha = isMuted ? 0.1 : 1;
                    ctx.fill();

                    if (node === selectedNode) {
                        ctx.lineWidth = 2.5 / globalScale;
                        ctx.strokeStyle = '#3b82f6';
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;

                    // LEVEL OF DETAIL (LOD) OPTIMIZATION
                    // Skip text rendering entirely if zoomed out to save CPU!
                    const isCommunity = ['repo', 'project', 'tag'].includes(node.type);
                    
                    let shouldDrawLabel = false;
                    if (showLabelsGlobally) {
                        // If globally on, only draw if we aren't zoomed out extremely far
                        shouldDrawLabel = globalScale > 0.3; 
                    } else {
                        // Normal mode: Draw communities if decently zoomed, OR draw if highlighted
                        shouldDrawLabel = (isCommunity && globalScale > 0.7 && !isMuted) || (isHighlight && !isMuted);
                    }

                    if (shouldDrawLabel) {
                        const label = node.name || node.id;
                        const fontSize = isCommunity ? 13/globalScale : 11/globalScale;
                        
                        ctx.font = `${isCommunity ? '700' : '500'} ${fontSize}px 'Inter', sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        
                        const textY = node.y + r + (8/globalScale) + (fontSize/2);

                        ctx.lineWidth = 3 / globalScale;
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                        ctx.strokeText(label, node.x, textY);

                        ctx.fillStyle = isCommunity ? node.renderColor : '#475569';
                        ctx.fillText(label, node.x, textY);
                    }
                })
                .onNodeHover(node => {
                    elem.style.cursor = node ? 'pointer' : null;
                    if (selectedNode) return;
                    hoverNode = node;
                    updateHighlight();
                })
                .onNodeClick(node => {
                    if (selectedNode === node) {
                        selectedNode = null;
                        document.getElementById('inspector-panel').classList.add('hidden');
                    } else {
                        selectedNode = node;
                        populateInspector(node);
                        document.getElementById('inspector-panel').classList.remove('hidden');
                        
                        graph.centerAt(node.x, node.y, 1000);
                        graph.zoom(6, 1500);
                    }
                    updateHighlight();
                })
                .onBackgroundClick(() => {
                    selectedNode = null;
                    hoverNode = null;
                    updateHighlight();
                    document.getElementById('inspector-panel').classList.add('hidden');
                });
                
            // PHYSICS OPTIMIZATION
            graph.d3Force('charge')
                .strength(-40)
                .distanceMax(300); // Skip repulsion between far-apart nodes — the biggest per-tick cost on large graphs
            graph.d3Force('link').distance(35);

            // Settle faster so the simulation (and its per-frame repaint) stops sooner
            graph.d3AlphaDecay(0.05).d3VelocityDecay(0.5);

            // Auto-pause physics after short warmup to prevent CPU burn on massive graphs
            graph.cooldownTicks(150);
            graph.onEngineStop(() => {
                isPhysicsRunning = false;
                updatePhysicsBtnUI();
            });
        }

        // O(1) Fast Highlights
        function updateHighlight() {
            highlightNodes.clear();
            highlightLinks.clear();
            
            const activeCenter = selectedNode || hoverNode;

            if (activeCenter) {
                highlightNodes.add(activeCenter);
                
                // Get pre-calculated links instantly
                const connectedLinks = nodeLinksMap.get(activeCenter.id) || [];
                connectedLinks.forEach(link => {
                    highlightLinks.add(link);
                    const sid = typeof link.source === 'object' ? link.source.id : link.source;
                    const tid = typeof link.target === 'object' ? link.target.id : link.target;
                    
                    highlightNodes.add(nodeByIdMap.get(sid));
                    highlightNodes.add(nodeByIdMap.get(tid));
                });
            }
            
            graph.nodeColor(graph.nodeColor()); 
            graph.linkWidth(graph.linkWidth());
        }

        function populateInspector(node) {
            document.getElementById('inspector-title').textContent = node.name || node.id;
            document.getElementById('inspector-type').textContent = node.type;
            
            const propsHtml = [];
            if (node.title) propsHtml.push(`<div><span class="text-slate-400 font-semibold text-xs">Title:</span> ${node.title}</div>`);
            if (node.repo) propsHtml.push(`<div><span class="text-slate-400 font-semibold text-xs">Repo:</span> ${node.repo}</div>`);
            if (node.project) propsHtml.push(`<div><span class="text-slate-400 font-semibold text-xs">Project:</span> ${node.project}</div>`);
            if (node.raw && node.raw.path) propsHtml.push(`<div><span class="text-slate-400 font-semibold text-xs">Path:</span> <span class="break-all text-[11px] text-slate-500">${node.raw.path}</span></div>`);
            
            document.getElementById('inspector-props').innerHTML = propsHtml.length > 0 ? propsHtml.join('') : '<div class="text-slate-400 italic">No extra properties</div>';

            const connections = [];
            const connectedNodesSet = neighborNodesMap.get(node.id) || new Set();
            
            connectedNodesSet.forEach(nId => {
                const t = nodeByIdMap.get(nId);
                if(t) connections.push({ name: t.name || t.id, type: t.type });
            });

            document.getElementById('inspector-conn-count').textContent = connections.length;
            
            const connsHtml = connections.slice(0, 100).map(c => `
                <div class="flex items-center gap-2 p-1.5 hover:bg-slate-50 rounded-md cursor-default border border-transparent transition-colors">
                    <span class="w-2.5 h-2.5 rounded-full shadow-sm" style="background-color: ${colors[c.type] || colors.file}"></span>
                    <span class="truncate" title="${c.name}">${c.name}</span>
                </div>
            `).join('');
            
            document.getElementById('inspector-conns').innerHTML = connsHtml + (connections.length > 100 ? '<div class="text-xs text-slate-400 mt-2 italic text-center">...and more</div>' : '');
        }

        function updateStats() {
            document.getElementById('stat-nodes').textContent = activeData.nodes.length.toLocaleString();
            document.getElementById('stat-edges').textContent = activeData.links.length.toLocaleString();
            document.getElementById('stat-projects').textContent = activeData.nodes.filter(n => n.type === 'project').length.toLocaleString();
            document.getElementById('stat-tags').textContent = activeData.nodes.filter(n => n.type === 'tag').length.toLocaleString();
        }

        // Debounced execution for filters so UI doesn't freeze on typing
        const applyFiltersDebounced = debounce(() => {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const nameFilter = document.getElementById('filter-name').value.toLowerCase();
            const titleFilter = document.getElementById('filter-title').value.toLowerCase();

            const filteredNodes = originalData.nodes.filter(node => {
                if (searchTerm) {
                    const nameMatch = (node.name || '').toLowerCase().includes(searchTerm);
                    const titleMatch = (node.title || '').toLowerCase().includes(searchTerm);
                    if (!nameMatch && !titleMatch) return false;
                }
                if (nameFilter && !(node.name || '').toLowerCase().includes(nameFilter)) return false;
                if (titleFilter && !(node.title || '').toLowerCase().includes(titleFilter)) return false;
                
                if (multiSelectState.type.size > 0 && !multiSelectState.type.has(node.type)) return false;
                if (multiSelectState.repo.size > 0 && node.type === 'file' && !multiSelectState.repo.has(node.repo)) return false;
                if (multiSelectState.project.size > 0 && node.type === 'file' && !multiSelectState.project.has(node.project)) return false;
                
                return true;
            });

            const validNodeIds = new Set(filteredNodes.map(n => n.id));

            if (multiSelectState.tag.size > 0) {
                const taggedNodeIds = new Set();
                originalData.links.forEach(l => {
                    const s = typeof l.source === 'object' ? l.source.id : l.source;
                    const t = typeof l.target === 'object' ? l.target.id : l.target;
                    
                    let hasTag = false;
                    multiSelectState.tag.forEach(tagVal => {
                        if (t === `tag_${tagVal}` || s === `tag_${tagVal}`) hasTag = true;
                    });
                    if (hasTag) { taggedNodeIds.add(s); taggedNodeIds.add(t); }
                });
                
                for (let id of validNodeIds) {
                    const n = filteredNodes.find(x => x.id === id);
                    if (n.type === 'file' && !taggedNodeIds.has(id)) {
                        validNodeIds.delete(id);
                    }
                }
            }

            const filteredLinks = originalData.links.filter(link => {
                const s = typeof link.source === 'object' ? link.source.id : link.source;
                const t = typeof link.target === 'object' ? link.target.id : link.target;
                return validNodeIds.has(s) && validNodeIds.has(t);
            });

            activeData = {
                nodes: originalData.nodes.filter(n => validNodeIds.has(n.id)),
                links: filteredLinks
            };

            loadData(activeData, false);
            
            // Re-warm physics slightly on filter change
            graph.d3ReheatSimulation();
            graph.cooldownTicks(60);
        }, 300);

        function updatePhysicsBtnUI() {
            const btnPhysics = document.getElementById('btn-physics');
            if (isPhysicsRunning) {
                btnPhysics.innerHTML = '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg> Physics On';
                btnPhysics.classList.replace('text-slate-400', 'text-emerald-600');
            } else {
                btnPhysics.innerHTML = '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 002 0V8a1 1 0 00-1-1zm4 0a1 1 0 00-1 1v4a1 1 0 002 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg> Physics Off';
                btnPhysics.classList.replace('text-emerald-600', 'text-slate-400');
            }
        }

        // MASSIVE 30k GENERATOR FOR PERFORMANCE TESTING
        function generateMassiveData() {
            const btnText = document.getElementById('btn-generate-text');
            btnText.textContent = "Generating...";
            
            setTimeout(() => {
                const nodes = [];
                const links = [];
                const projectCount = 50;
                const tagCount = 100;
                const fileCount = 30000;

                for (let i = 0; i < projectCount; i++) {
                    nodes.push({ id: `proj_${i}`, name: `Project-${i}`, type: 'project', val: 15 });
                }
                for (let i = 0; i < tagCount; i++) {
                    nodes.push({ id: `tag_${i}`, name: `#tag_${i}`, type: 'tag', val: 8 });
                }

                for (let i = 0; i < fileCount; i++) {
                    const nodeId = `file_${i}`;
                    nodes.push({ id: nodeId, name: `SynthFile_${i}.md`, title: `Massive File ${i}`, type: 'file', val: 2 });
                    
                    const projTarget = Math.floor(Math.random() * projectCount);
                    links.push({ source: nodeId, target: `proj_${projTarget}` });

                    const numTags = Math.floor(Math.random() * 3);
                    for(let t=0; t<numTags; t++) {
                        const tagTarget = Math.floor(Math.random() * tagCount);
                        links.push({ source: nodeId, target: `tag_${tagTarget}` });
                    }
                }

                loadData({ nodes, links });
                
                document.getElementById('btn-reset').classList.remove('hidden');
                document.getElementById('btn-generate').classList.add('hidden');
                btnText.textContent = "Test Scale (30k)";
            }, 100);
        }

        // --- LIFECYCLE BINDINGS ---
        
        window.onload = function() {
            initGraph();
            
            document.getElementById('btn-zoom-in').onclick = () => graph.zoom(graph.zoom() * 1.3, 400);
            document.getElementById('btn-zoom-out').onclick = () => graph.zoom(graph.zoom() / 1.3, 400);
            document.getElementById('btn-fit').onclick = () => graph.zoomToFit(400, 50);
            
            document.getElementById('btn-physics').onclick = () => {
                if (isPhysicsRunning) {
                    graph.d3Force('charge').strength(0); 
                    graph.cooldownTicks(0); // Pause instantly
                } else {
                    graph.d3Force('charge').strength(-40);
                    graph.d3ReheatSimulation();
                    graph.cooldownTicks(150); // Re-run the layout, then let it settle (no permanent CPU burn)
                }
                isPhysicsRunning = !isPhysicsRunning;
                updatePhysicsBtnUI();
            };

            document.getElementById('btn-close-inspector').addEventListener('click', () => {
                selectedNode = null;
                updateHighlight();
                document.getElementById('inspector-panel').classList.add('hidden');
            });

            const toggleLabelsEl = document.getElementById('toggle-labels');
            if (toggleLabelsEl) {
                toggleLabelsEl.addEventListener('change', (e) => {
                    showLabelsGlobally = e.target.checked;
                    updateHighlight(); 
                });
            }

            // Bind inputs to Debounced Filter
            ['search-input', 'filter-name', 'filter-title'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.addEventListener('input', applyFiltersDebounced);
            });

            document.getElementById('btn-generate').addEventListener('click', generateMassiveData);

            document.getElementById('btn-reset').addEventListener('click', () => {
                // Try fetching default sample JSON
                fetch('sample.json')
                    .then(res => res.json())
                    .then(data => loadData(synthesizeGraphData(data)))
                    .catch(() => loadData(synthesizeGraphData([]))); // empty fallback
                    
                document.getElementById('btn-reset').classList.add('hidden');
                document.getElementById('btn-generate').classList.remove('hidden');
            });

            document.getElementById('file-upload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        let graphData;
                        if (Array.isArray(json)) graphData = synthesizeGraphData(json);
                        else if (json.nodes && (json.edges || json.links)) graphData = { nodes: json.nodes, links: json.links || json.edges };
                        else throw new Error("Format must be flat array or {nodes, links}");
                        
                        loadData(graphData);
                        document.getElementById('btn-reset').classList.remove('hidden');
                    } catch (err) {
                        alert("Error parsing JSON: " + err.message);
                    } finally {
                        e.target.value = ''; // FIX: Allow re-uploading same file
                    }
                };
                reader.readAsText(file);
            });

            // Initial load Attempt
            fetch('sample.json')
                .then(res => res.json())
                .then(data => loadData(synthesizeGraphData(data)))
                .catch(err => console.log("Upload a file or use Test Scale to start."));
                
            window.addEventListener('resize', () => {
                const container = document.getElementById('graph-container');
                graph.width(container.clientWidth).height(container.clientHeight);
            });
        };
    </script>
</body>
</html>
