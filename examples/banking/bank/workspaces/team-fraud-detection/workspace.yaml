version: 1
# P9: the team repo IS the workspace root. `company-os workspace sync` materializes
# the repos below as read-only slices (files 0444 / dirs 0555) into the canonical
# roots around the team's own writable teams/fraud-detection/ content.
repos:
  - name: company-os
    url: https://git.example.com/bank/company-os.git
    root: company-os
    pin: {tag: v2026.2}
    paths: [standards/, onboarding/, skills/, templates/]
  - name: company-ontology
    url: https://git.example.com/bank/company-ontology.git
    root: company-ontology
    pin: {tag: v2026.2}
    paths: [ids/, contexts/, context-maps/, concepts/, taxonomies/]
  - name: platform-fraud
    url: https://git.example.com/bank/platform-fraud.git
    root: platforms/fraud
    pin: {commit: 1111111111111111111111111111111111111111}  # illustrative
    paths: [governance/, components/, reality/, skills/, templates/]
  - name: platform-payments
    url: https://git.example.com/bank/platform-payments.git
    root: platforms/payments
    pin: {commit: 2222222222222222222222222222222222222222}  # illustrative
    paths: [governance/, components/, reality/]
  - name: platform-cards
    url: https://git.example.com/bank/platform-cards.git
    root: platforms/cards
    pin: {commit: 3333333333333333333333333333333333333333}  # illustrative
    paths: [governance/, components/, reality/]
  - name: platform-identity
    url: https://git.example.com/bank/platform-identity.git
    root: platforms/identity
    pin: {commit: 4444444444444444444444444444444444444444}  # illustrative
    paths: [governance/, components/]
