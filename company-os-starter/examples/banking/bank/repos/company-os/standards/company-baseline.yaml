schemaVersion: '1.0'
kind: CompanyBaseline
controls:
- {id: data-residency, version: '1.0', level: mandatory, requirement: 'EU customer
    data is stored and processed only in EU regions; residency evidence is produced
    for the annual audit. (Outcome, not implementation.)

    '}
- {id: security-service-baseline, version: '3.0', level: mandatory, requirement: 'Services
