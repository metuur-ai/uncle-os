    security review.

    '}
- {id: estimation-story-points, version: '1.1', level: default, requirement: 'Teams
    estimate delivery work in story points.

    '}
- {id: adr-format, version: '1.0', level: guidance, requirement: 'Architecture decisions
    are recorded as lightweight ADRs.

    '}
tags: [kind/baseline, scope/company, tier/mixed]
